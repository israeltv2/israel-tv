packages:
  - packages/*
  - apps/*
  - spikes
minimumReleaseAgeExclude:
  - playwright-core@1.65.0
  - miniflare@5.20261104.0-beta
  - wrangler@4.158.0
  - "@cloudflare/workers-types@5.20261106.1"
  - undici@8.12.4

# Dependencies allowed to run install scripts (esbuild and workerd fetch their platform binaries).
allowBuilds:
  esbuild: true
  workerd: true
  # swc ships prebuilt binaries; its postinstall only double-checks them.
  "@swc/core": false
  # Installs the git hooks (lefthook.yml) into this clone.
  lefthook: true

# Versions shared by several packages, set once here (`"dep": "catalog:"` in each package.json).
catalogMode: strict
catalog:
  croner: 11.0.0
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  hono: 4.13.16
  playwright-core: 1.65.0
  zod: 4.6.7
