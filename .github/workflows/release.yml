name: release
# Releases: release-please keeps a release pull request open from the conventional commits on main; merging it tags
# the version, writes the changelog and publishes the release — and then, in this same run (a release made by the
# workflow's token starts no other workflow), the images are built for amd64 and arm64 to GHCR and the home-helper
# image is checked from a clean machine. A release published by hand runs the same image jobs.
on:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  # release-please opens and updates its pull request with the workflow token. GitHub holds the pull_request
  # workflows of such pull requests for approval (they end "action required" and never run), so the checks the
  # branch rules require are started here instead, on the release branch (workflow_dispatch is allowed from the
  # workflow token); their results land on the pull request's head commit under the same names. The held runs are
  # removed, so the pull request shows only real results.
  release-pr-checks:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      TITLE: ${{ fromJSON(needs.release-please.outputs.pr).title }}
    steps:
      - name: Run the checks on the release pull request
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run pr-title.yml --ref "$BRANCH" -f title="$TITLE"
      - name: Remove the runs held for approval
        run: |
          # The held runs appear a few seconds after release-please pushes; look for two minutes.
          for i in $(seq 1 12); do
            for id in $(gh api "repos/$GH_REPO/actions/runs?branch=$BRANCH&event=pull_request&per_page=50" \
                --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id'); do
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" && echo "removed held run $id"
            done
            sleep 10
          done
  images:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: israel-tv-resolver
            file: Dockerfile.resolver
          - image: israel-tv
            file: Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: v
        env:
          VERSION: ${{ needs.release-please.outputs.version || github.event.release.tag_name }}
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  verify:
    # The published home helper, from a clean machine: pull, run as a viewer would, fetch its manifest, check the
    # public catalog through it.
    needs: [release-please, images]
    if: always() && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the published home helper
        run: |
          image=ghcr.io/${{ github.repository_owner }}/israel-tv-resolver:latest
          docker run -d --name helper -p 7701:7701 "$image"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7701/manifest.json && break; sleep 2; done
          curl -sf http://127.0.0.1:7701/manifest.json | grep -q '"stream"'
          docker exec helper node apps/resolver/src/cli.ts check-catalog
