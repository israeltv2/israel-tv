name: release
# Releases: release-please keeps a release pull request open from the conventional commits on main; merging it tags
# the version, writes the changelog and publishes the release — and then, in this same run (a release made by the
# workflow's token starts no other workflow), the images are built for amd64 and arm64 to GHCR and the home-helper
# image is checked from a clean machine. A release published by hand runs the same image jobs.
on:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  images:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: israel-tv-resolver
            file: Dockerfile.resolver
          - image: israel-tv
            file: Dockerfile
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=${{ needs.release-please.outputs.version || github.event.release.tag_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  verify:
    # The published home helper, from a clean machine: pull, run as a viewer would, fetch its manifest, check the
    # public catalog through it.
    needs: [release-please, images]
    if: always() && needs.images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the published home helper
        run: |
          image=ghcr.io/${{ github.repository_owner }}/israel-tv-resolver:latest
          docker run -d --name helper -p 7701:7701 "$image"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7701/manifest.json && break; sleep 2; done
          curl -sf http://127.0.0.1:7701/manifest.json | grep -q '"stream"'
          docker exec helper node apps/resolver/src/cli.ts check-catalog
