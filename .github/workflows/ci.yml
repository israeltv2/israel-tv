name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Started by the release workflow on release-please's pull request (see release.yml): GitHub holds workflows on
  # pull requests opened by the workflow token for approval, so they would never run there on their own.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Every role must run on Windows, macOS and Linux: all three check every pull request (required checks).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm boundaries
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm hygiene
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm check:addresses
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm budget:workers
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm test:strict
      # Start local-only and resolver-only and fetch their manifests (no broadcaster site contacted).
      - run: pnpm smoke
      # The owner's dashboard in a real browser: every section, phone and desktop, light and dark.
      - run: pnpm e2e:dashboard
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm shots:dashboard
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: dashboard-screens
          path: dashboard-screens/
          if-no-files-found: ignore
  windows-task:
    # The Windows background task, for real: install it for the helper, fetch the manifest it serves, stop it (no
    # process may keep the port), remove it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@israel-tv/resolver..."
      - name: Install, check, stop and remove the task
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'israel-tv'
          New-Item -ItemType Directory -Force $dir | Out-Null
          '{"role":"resolver-only","resolver":{"catalogUrl":"https://israel-tv.israeltv2.workers.dev/manifest.json"}}' |
            Set-Content -Encoding utf8NoBOM (Join-Path $dir 'israel-tv.config.json')
          powershell -ExecutionPolicy Bypass -File deploy\windows\install-task.ps1 -Resolver
          $ok = $false
          foreach ($i in 1..60) {
            try { $m = Invoke-RestMethod http://127.0.0.1:7701/manifest.json; if ($m.name) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          if (-not $ok) { Get-ChildItem $dir -Recurse | Out-String | Write-Host; throw 'the task did not serve the manifest' }
          Write-Host "served: $($m.name)"
          Get-ChildItem (Join-Path $dir 'data\logs') | Out-String | Write-Host
          powershell -ExecutionPolicy Bypass -File deploy\\windows\\install-task.ps1 -Resolver -Stop
          Start-Sleep 3
          $still = Get-NetTCPConnection -LocalPort 7701 -State Listen -ErrorAction SilentlyContinue
          if ($still) { throw "port 7701 still in use after stopping the task (pid $($still.OwningProcess))" }
          powershell -ExecutionPolicy Bypass -File deploy\windows\install-task.ps1 -Resolver -Remove
  audit:
    # Known vulnerabilities in dependencies: reported on every pull request, never fixed by a bot.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm audit --prod --audit-level=high
  report:
    # A dispatched run (on release-please's pull request, see release.yml) also reports its results as commit
    # statuses under the same names: the branch rules count those on a pull request, dispatched check runs not.
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [check, windows-task, audit]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHECK: ${{ needs.check.result }}
      WINDOWS_TASK: ${{ needs.windows-task.result }}
      AUDIT: ${{ needs.audit.result }}
      STATUSES: repos/${{ github.repository }}/statuses/${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          post() {
            state=failure; [ "$2" = success ] && state=success
            gh api -X POST "$STATUSES" -f state="$state" -f context="$1" -f target_url="$RUN_URL" \
              -f description="$2 (run for the release pull request)" > /dev/null
            echo "$1: $state"
          }
          for os in ubuntu-latest windows-latest macos-latest; do post "check ($os)" "$CHECK"; done
          post windows-task "$WINDOWS_TASK"
          post audit "$AUDIT"
