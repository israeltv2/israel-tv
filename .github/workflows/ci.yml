name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Every role must run on Windows, macOS and Linux: the whole suite runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm boundaries
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm hygiene
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm test:strict
  audit:
    # Known vulnerabilities in dependencies: reported on every pull request, never fixed by a bot.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm audit --prod --audit-level=high
