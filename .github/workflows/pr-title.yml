name: pr-title
# Pull requests are squash-merged with their title as the commit message: titles follow Conventional Commits
# (feat:, fix:, docs:, chore:, …) so releases and the changelog can be made from them.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Started by the release workflow for release-please's pull request (see release.yml), with its title.
  workflow_dispatch:
    inputs:
      title:
        description: The pull request title to check
        required: true
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title || inputs.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|perf|build|style|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "Pull request title must follow Conventional Commits, e.g. 'fix(kan): …' or 'docs: …'. Got: $TITLE"
            exit 1
          fi
      - name: Report to the release pull request (dispatched run; see release.yml)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUSES: repos/${{ github.repository }}/statuses/${{ github.sha }}
        run: gh api -X POST "$STATUSES" -f state="$STATE" -f context=title -f description="title check" > /dev/null
