# Run from the repo root:
#   mkdir -p deploy/data && sudo chown -R 1000:1000 deploy/data   # the container runs as uid 1000
#   cp deploy/docker.config.example.json deploy/data/israel-tv.config.json   # local publisher
#   (or deploy/docker.cloudflare.config.example.json for the Cloudflare publisher)
#   cp .env.example deploy/data/.env   # fill in only what your config uses; chmod 600
#   docker compose -f deploy/docker-compose.yml up -d
# Data (database, events, backups, rendered files) lives in deploy/data.
# Commands inside the container, e.g. the admin link (the token is generated on first start unless .env sets
# ISRAEL_TV_ADMIN_TOKEN):
#   docker compose -f deploy/docker-compose.yml exec israel-tv node apps/ingest/src/cli.ts admin-url
# It prints the container's address: open http://127.0.0.1:7702/usage?token=… on this machine instead, or from
# another machine through `ssh -L 7702:127.0.0.1:7702 <this server>`. Same pattern for check-proxy, status,
# remote-url; for restore, stop the service first and use `docker compose run --rm israel-tv node apps/ingest/src/cli.ts restore <url>`.
# Inside Docker the startup log shows the container's address (172.x); in your app install
# http://<this machine's LAN IP>:7701/manifest.json (and :7700 for the local publisher) instead, and open
# the admin page at http://127.0.0.1:7702/status on this machine.
services:
  israel-tv:
    build: ..
    restart: unless-stopped
    ports:
      - "7700:7700" # addon (local publisher only; drop this line with the Cloudflare publisher)
      - "7701:7701" # resolver (keep it off the internet: no login; plays Mako and relays through your proxy)
      # Admin (/status, refresh) is bound to this host only: behind Docker's port mapping every client
      # looks like a private address, so the "local network only" check cannot tell them apart.
      - "127.0.0.1:7702:7702"
      # Mako away from home (resolver.remote): for a tunnel connector on this host only.
      - "127.0.0.1:7703:7703"
    volumes:
      - ./data:/data
